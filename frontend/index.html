<!doctype html>
<html lang="en" style="background:#090D14">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>SATIQ Analysis Workstation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      html, body { background:#090D14; color:#F8FAFC; margin:0; height:100%; overflow:hidden; }
      #root { height:100vh; width:100vw; overflow:hidden; background:#090D14; }
      #root:empty { background:#090D14; min-height:100vh; }
      #root:empty::before { content:""; position:fixed; inset:0; background:#090D14; z-index:9999; }
      body { opacity:0; animation:fadeInRoot 0.12s ease-out forwards; }
      @keyframes fadeInRoot { to { opacity:1; } }
    </style>
  </head>
  <body class="dark bg-[#090D14] text-slate-200 antialiased overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
